# DeltaForce standard pipeline for a Databricks Asset Bundle — a proposal, used only when the client has no
# pipeline templates of its own. The DevOps Engineer adapts it to the project; the PO validates it at G2.
#
# Pull requests to the protected branch: validate the bundle. Pushes to the protected branch: validate, then
# deploy the production target.
#
# Configure in Azure DevOps before the first run:
#   - variable group "databricks-prod" with DATABRICKS_HOST (production workspace), DATABRICKS_CLIENT_ID and
#     DATABRICKS_CLIENT_SECRET (secret) of the service principal, and one BUNDLE_VAR_<name> for every bundle
#     variable without a default (see resources/deltaforce.variables.yml and the project's own variable files);
#   - environment "databricks-prod" with the client's approvals.
# Replace "main" with the protected branch of the project.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: databricks-prod

stages:
  - stage: Validate
    jobs:
      - job: validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - script: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: Install the Databricks CLI
          - script: databricks bundle validate -t prod
            displayName: Validate the bundle
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
              BUNDLE_VAR_catalog: $(BUNDLE_VAR_catalog)
              BUNDLE_VAR_warehouse_id: $(BUNDLE_VAR_warehouse_id)
              BUNDLE_VAR_schema_bronze: $(BUNDLE_VAR_schema_bronze)
              BUNDLE_VAR_schema_silver: $(BUNDLE_VAR_schema_silver)
              BUNDLE_VAR_schema_gold: $(BUNDLE_VAR_schema_gold)

  - stage: Deploy
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: deploy
        pool:
          vmImage: ubuntu-latest
        environment: databricks-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                  displayName: Install the Databricks CLI
                - script: databricks bundle deploy -t prod
                  displayName: Deploy the production target
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
                    BUNDLE_VAR_catalog: $(BUNDLE_VAR_catalog)
                    BUNDLE_VAR_warehouse_id: $(BUNDLE_VAR_warehouse_id)
                    BUNDLE_VAR_schema_bronze: $(BUNDLE_VAR_schema_bronze)
                    BUNDLE_VAR_schema_silver: $(BUNDLE_VAR_schema_silver)
                    BUNDLE_VAR_schema_gold: $(BUNDLE_VAR_schema_gold)
