# DeltaForce standard workflow for a Databricks Asset Bundle — a proposal, used only when the client has no
# pipeline templates of its own. The DevOps Engineer adapts it and places it in .github/workflows/; the PO
# validates it at G2.
#
# Pull requests to the protected branch: validate the bundle. Pushes to the protected branch: validate, then
# deploy the production target.
#
# Configure in GitHub before the first run:
#   - environment "databricks-prod" with the client's approvals;
#   - variables DATABRICKS_HOST (production workspace) and DATABRICKS_CLIENT_ID, secret DATABRICKS_CLIENT_SECRET
#     of the service principal, and one BUNDLE_VAR_<name> variable for every bundle variable without a default.
# Replace "main" with the protected branch of the project.

name: databricks-bundle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  BUNDLE_VAR_catalog: ${{ vars.BUNDLE_VAR_catalog }}
  BUNDLE_VAR_warehouse_id: ${{ vars.BUNDLE_VAR_warehouse_id }}
  BUNDLE_VAR_schema_bronze: ${{ vars.BUNDLE_VAR_schema_bronze }}
  BUNDLE_VAR_schema_silver: ${{ vars.BUNDLE_VAR_schema_silver }}
  BUNDLE_VAR_schema_gold: ${{ vars.BUNDLE_VAR_schema_gold }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate the bundle
        run: databricks bundle validate -t prod

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: databricks-prod
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy the production target
        run: databricks bundle deploy -t prod
