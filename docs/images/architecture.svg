<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="DeltaForce architecture: the Product Owner, the agent team in Claude Code, guardrails, Databricks tooling, workspaces and the monitor">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#66737f"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 700; fill: #e4eaef; }
    .body { font-size: 12.5px; fill: #94a2ae; }
    .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 11.5px; fill: #4bb9c3; }
    .chip { font-size: 18px; font-weight: 700; fill: #fff; }
    .chip-name { font-size: 11px; fill: #e4eaef; }
    .line { stroke: #66737f; stroke-width: 1.5; fill: none; }
  </style>

  <rect width="1200" height="760" rx="20" fill="#0f1419"/>

  <!-- Product Owner -->
  <rect x="440" y="22" width="320" height="58" rx="12" fill="#3a2717" stroke="#f0954a"/>
  <text x="600" y="47" class="title" text-anchor="middle">You — the Product Owner</text>
  <text x="600" y="67" class="body" text-anchor="middle">request · G1 design · G2 per feature · changes</text>
  <path d="M600 80 V108" class="line" marker-end="url(#arrow)"/>

  <!-- Claude Code -->
  <rect x="40" y="112" width="1120" height="246" rx="16" fill="#161d24" stroke="#26303a"/>
  <text x="62" y="138" class="body">Claude Code · inside your repository</text>

  <rect x="465" y="148" width="270" height="54" rx="10" fill="#6b4fb3"/>
  <text x="600" y="171" class="title" text-anchor="middle">Project Manager</text>
  <text x="600" y="191" font-size="12" fill="#ece6ff" text-anchor="middle">plans · delegates · tracks · runs the gates</text>

  <path d="M600 202 V220 M135 220 H1065" class="line"/>
  <g>
    <path d="M135 220 V234 M268 220 V234 M401 220 V234 M534 220 V234 M667 220 V234 M800 220 V234 M933 220 V234 M1065 220 V234" class="line"/>
    <rect x="75"   y="236" width="120" height="64" rx="10" fill="#2f5fb3"/><text x="135"  y="262" class="chip" text-anchor="middle">SA</text><text x="135"  y="285" class="chip-name" text-anchor="middle">Solution Architect</text>
    <rect x="208"  y="236" width="120" height="64" rx="10" fill="#1f8a9a"/><text x="268"  y="262" class="chip" text-anchor="middle">BA</text><text x="268"  y="285" class="chip-name" text-anchor="middle">Business Analyst</text>
    <rect x="341"  y="236" width="120" height="64" rx="10" fill="#c0661e"/><text x="401"  y="262" class="chip" text-anchor="middle">DE</text><text x="401"  y="285" class="chip-name" text-anchor="middle">Data Engineer</text>
    <rect x="474"  y="236" width="120" height="64" rx="10" fill="#2e8a4f"/><text x="534"  y="262" class="chip" text-anchor="middle">DA</text><text x="534"  y="285" class="chip-name" text-anchor="middle">Data Analyst</text>
    <rect x="607"  y="236" width="120" height="64" rx="10" fill="#a88414"/><text x="667"  y="262" class="chip" text-anchor="middle">DS</text><text x="667"  y="285" class="chip-name" text-anchor="middle">Data Scientist</text>
    <rect x="740"  y="236" width="120" height="64" rx="10" fill="#b0457c"/><text x="800"  y="262" class="chip" text-anchor="middle">AI</text><text x="800"  y="285" class="chip-name" text-anchor="middle">AI Engineer</text>
    <rect x="873"  y="236" width="120" height="64" rx="10" fill="#b8352b"/><text x="933"  y="262" class="chip" text-anchor="middle">QA</text><text x="933"  y="285" class="chip-name" text-anchor="middle">QA Engineer</text>
    <rect x="1005" y="236" width="120" height="64" rx="10" fill="#4d5c6b"/><text x="1065" y="262" class="chip" text-anchor="middle">DO</text><text x="1065" y="285" class="chip-name" text-anchor="middle">DevOps Engineer</text>
  </g>
  <text x="600" y="336" class="body" text-anchor="middle">specialists work in parallel, each in its own git worktree · state, backlog and reports saved in .deltaforce/</text>

  <!-- Guardrails -->
  <rect x="40" y="374" width="1120" height="46" rx="10" fill="#3b1d1b" stroke="#f2776c"/>
  <text x="600" y="395" font-size="14" font-weight="700" fill="#f2776c" text-anchor="middle">Guardrail and audit hooks — every action checked before it runs</text>
  <text x="600" y="412" class="body" text-anchor="middle">resources only through the bundle · writes only in the dev catalog · production read-only · protected branches untouched · everything audited</text>

  <!-- Tooling -->
  <path d="M171 420 V438 M457 420 V438 M743 420 V438 M1029 420 V438" class="line" marker-end="url(#arrow)"/>
  <rect x="40"  y="440" width="262" height="94" rx="12" fill="#15363a" stroke="#4bb9c3"/>
  <text x="171" y="466" class="title" text-anchor="middle">Databricks agent skills</text>
  <text x="171" y="488" class="mono" text-anchor="middle">databricks/databricks-agent-skills</text>
  <text x="171" y="510" class="body" text-anchor="middle">installed with databricks aitools</text>

  <rect x="326" y="440" width="262" height="94" rx="12" fill="#15363a" stroke="#4bb9c3"/>
  <text x="457" y="466" class="title" text-anchor="middle">AI Dev Kit MCP server</text>
  <text x="457" y="488" class="mono" text-anchor="middle">databricks-solutions/ai-dev-kit</text>
  <text x="457" y="510" class="body" text-anchor="middle">query, explore and run on Databricks</text>

  <rect x="612" y="440" width="262" height="94" rx="12" fill="#1b232b" stroke="#66737f"/>
  <text x="743" y="466" class="title" text-anchor="middle">Databricks CLI + Asset Bundle</text>
  <text x="743" y="488" class="body" text-anchor="middle">every resource declared in the bundle</text>
  <text x="743" y="508" class="body" text-anchor="middle">deployed by the DevOps Engineer</text>

  <rect x="898" y="440" width="262" height="94" rx="12" fill="#1b232b" stroke="#66737f"/>
  <text x="1029" y="466" class="title" text-anchor="middle">Git</text>
  <text x="1029" y="488" class="body" text-anchor="middle">dev branch · feature and task branches</text>
  <text x="1029" y="508" class="body" text-anchor="middle">a person opens the PR to main</text>

  <!-- Targets -->
  <path d="M171 534 V570 M457 534 V570 M743 534 V570 M1029 534 V570" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="572" width="548" height="120" rx="12" fill="#161d24" stroke="#26303a"/>
  <text x="62" y="598" class="title">Databricks dev workspace</text>
  <text x="62" y="620" class="body">bundle deployed on the dev target: jobs, pipelines, dashboards, models, apps</text>
  <rect x="62"  y="640" width="150" height="32" rx="8" fill="#9c5f2b"/><text x="137" y="661" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Bronze</text>
  <path d="M212 656 H240" class="line" marker-end="url(#arrow)"/>
  <rect x="242" y="640" width="150" height="32" rx="8" fill="#6f7d8b"/><text x="317" y="661" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Silver</text>
  <path d="M392 656 H420" class="line" marker-end="url(#arrow)"/>
  <rect x="422" y="640" width="150" height="32" rx="8" fill="#c9a227"/><text x="497" y="661" font-size="13" font-weight="700" fill="#1b1b1b" text-anchor="middle">Gold</text>

  <rect x="612" y="572" width="262" height="120" rx="12" fill="#161d24" stroke="#26303a"/>
  <text x="743" y="598" class="title" text-anchor="middle">Production workspace</text>
  <text x="743" y="622" class="body" text-anchor="middle">optional · read-only for the team</text>
  <text x="743" y="642" class="body" text-anchor="middle">queries · model and vector search</text>
  <text x="743" y="662" class="body" text-anchor="middle">calls · Genie · table stats</text>
  <text x="743" y="682" class="body" text-anchor="middle">deploys only through your CI/CD</text>

  <rect x="898" y="572" width="262" height="120" rx="12" fill="#161d24" stroke="#26303a"/>
  <text x="1029" y="598" class="title" text-anchor="middle">Monitor</text>
  <text x="1029" y="622" class="body" text-anchor="middle">local web page · uses no tokens</text>
  <text x="1029" y="642" class="body" text-anchor="middle">team · board · backlog · workflow</text>
  <text x="1029" y="662" class="body" text-anchor="middle">timeline · link in the status line</text>
  <text x="1029" y="682" class="mono" text-anchor="middle">reads .deltaforce/</text>

  <text x="600" y="728" class="body" text-anchor="middle">installed inside the project with one command · nothing global · the same versions for every team member</text>
</svg>
