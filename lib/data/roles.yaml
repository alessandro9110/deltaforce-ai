# DeltaForce roles: what the installer adds to each agent besides its template.
#
# Every agent is defined in templates/claude/agents/<role>.md in the Claude Code subagent format: YAML
# frontmatter (name, description, tools, model, skills, isolation, color) and the prompt. The installer renders
# .claude/agents/<role>.md from that template plus this catalog: it adds the Agent(...) allowlist from
# `delegates` (disabled roles are dropped), the Databricks MCP tools and, when production is configured, the
# read-only production tools; it applies the model chosen in the configuration, and installs the union of
# `skills` for the enabled roles. Keep role ids in sync with the role enums in schemas/ (tests enforce it).
#
#   title      human-readable name
#   mcp        Databricks MCP tools on the dev workspace (ai-dev-kit server "databricks")
#   prod_read  true when the role may read the production workspace (server "databricks-prod")
#   delegates  agent types the role may spawn
#   skills     Databricks agent skills installed for the role and listed in its prompt
#
# In the template frontmatter, `skills` are the DeltaForce skills preloaded into the agent: every preloaded skill
# is in the context of every call, so preload only what the role needs on every task; the others load on demand.

roles:
  pm:
    title: Project Manager
    mcp: [get_current_user]
    delegates: [business-analyst, solution-architect, data-engineer, data-analyst, data-scientist, ai-engineer, qa-engineer, devops-engineer, Explore]
    skills: [databricks-core]

  solution-architect:
    title: Solution Architect
    mcp: [get_current_user, execute_sql, get_table_stats_and_schema, get_volume_folder_details, list_compute, ask_genie]
    prod_read: true
    delegates: [data-engineer, data-analyst, data-scientist, ai-engineer, Explore]
    skills: [databricks-core, databricks-dabs, databricks-unity-catalog, databricks-docs, databricks-metric-views]

  business-analyst:
    title: Business Analyst
    mcp: [execute_sql, get_table_stats_and_schema, get_volume_folder_details, ask_genie]
    prod_read: true
    delegates: [data-analyst, Explore]
    skills: [databricks-core, databricks-data-discovery]

  data-engineer:
    title: Data Engineer
    mcp: [execute_sql, execute_sql_multi, execute_code, get_table_stats_and_schema, get_volume_folder_details, manage_volume_files, manage_uc_objects, manage_workspace_files, list_compute]
    prod_read: true
    delegates: [data-engineer]
    skills: [databricks-core, databricks-pipelines, databricks-jobs, databricks-dabs, databricks-lakeflow-connect, databricks-spark-structured-streaming]

  data-analyst:
    title: Data Analyst
    mcp: [execute_sql, execute_sql_multi, get_table_stats_and_schema, manage_metric_views, manage_dashboard, manage_genie, ask_genie]
    prod_read: true
    delegates: []
    skills: [databricks-core, databricks-dbsql, databricks-aibi-dashboards, databricks-metric-views, databricks-data-discovery]

  data-scientist:
    title: Data Scientist
    mcp: [execute_sql, execute_code, get_table_stats_and_schema, get_volume_folder_details, manage_volume_files, list_compute]
    prod_read: true
    delegates: [data-scientist, data-analyst]
    skills: [databricks-core, databricks-ml-training, databricks-synthetic-data-gen, databricks-python-sdk]

  ai-engineer:
    title: AI Engineer
    mcp: [execute_sql, execute_code, get_table_stats_and_schema, manage_volume_files, generate_and_upload_pdf, manage_vs_endpoint, manage_vs_index, manage_vs_data, query_vs_index, manage_serving_endpoint, manage_ka, manage_mas, manage_genie, ask_genie, manage_app]
    prod_read: true
    delegates: [ai-engineer, data-engineer]
    skills: [databricks-core, databricks-agent-bricks, databricks-vector-search, databricks-model-serving, databricks-mlflow-evaluation, databricks-ai-functions, databricks-apps-python]

  qa-engineer:
    title: QA Engineer
    mcp: [execute_sql, execute_sql_multi, execute_code, get_table_stats_and_schema, get_volume_folder_details, manage_job_runs, manage_pipeline_run, manage_dashboard, query_vs_index, ask_genie]
    prod_read: true
    delegates: [data-analyst]
    skills: [databricks-core, databricks-dbsql, databricks-mlflow-evaluation, databricks-synthetic-data-gen]

  devops-engineer:
    title: DevOps Engineer
    mcp: [get_current_user, list_tracked_resources, manage_jobs, manage_job_runs, manage_pipeline, manage_pipeline_run, manage_workspace_files]
