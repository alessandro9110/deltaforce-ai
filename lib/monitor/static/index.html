<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeltaForce</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 30 28H2z' fill='%230b6e78'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1 class="brand">Delta<span>Force</span></h1>
      <span class="project" id="project">—</span>
      <span class="phase" id="phase">…</span>
      <span class="spacer"></span>
      <a class="button" href="#workflow">Workflow</a>
      <a class="button" href="#docs">Documents</a>
      <span class="live" id="live"><i class="dot"></i><span>Connecting…</span></span>
    </header>

    <section class="now" id="now" aria-label="Now"></section>

    <section aria-labelledby="team-title">
      <div class="section-head">
        <h2 id="team-title">Team</h2>
        <span class="muted" id="team-count"></span>
      </div>
      <div class="team" id="team"></div>
    </section>

    <section aria-labelledby="board-title">
      <div class="section-head">
        <h2 id="board-title">Features</h2>
        <span class="muted" id="board-count"></span>
      </div>
      <div class="board-scroll"><div class="board" id="board"></div></div>
    </section>

    <p class="problems" id="problems" hidden></p>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-live="polite">
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
